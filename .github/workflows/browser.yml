name: Build skyward (browser card)

# Builds only the recovery program for the phone: the file named `skyward`.
# Run it by hand (Actions -> Build skyward (browser card) -> Run workflow)
# or it runs on every push.
on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build:
    name: Build skyward for arm64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build the recovery program for the phone
        run: cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward
      - name: Keep it
        uses: actions/upload-artifact@v7
        with:
          name: skyward
          path: target/aarch64-linux-android/release/skyward
          if-no-files-found: error
