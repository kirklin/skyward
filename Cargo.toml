[workspace]
resolver = "2"
members = [
    "crates/skyward",
    "crates/skyward-config",
    "crates/skyward-binder",
    "crates/skyward-backup",
    "crates/skyward-block",
    "crates/skyward-vab",
    "crates/skyward-modules",
    "crates/skyward-ui",
    "crates/skyward-crypto",
    "crates/skyward-files",
    "crates/skyward-info",
    "crates/skyward-install",
    "crates/skyward-mtp",
    "crates/skyward-net",
    "crates/skyward-preview",
    "crates/skyward-pack",
    "crates/skyward-sys",
    "crates/skyward-lp",
    "crates/skyward-bootimg",
    "crates/skyward-systems",
    "crates/skyward-system-init",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
libc = "0.2.175"
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.8"

[profile.release]
opt-level = "z"
# Optimizing across crates at link time does it at the binary's level,
# for size, over the UI's own.
lto = false
codegen-units = 1
panic = "abort"
strip = true

# The UI draws every pixel of every frame; it is built for speed.
[profile.release.package.skyward-ui]
opt-level = 3
