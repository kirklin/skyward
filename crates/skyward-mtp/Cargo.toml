[package]
name = "skyward-mtp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
# The recovery carries no time zone files, so the rules come built in.
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }
libc = { workspace = true }
skyward-block = { path = "../skyward-block" }
skyward-files = { path = "../skyward-files" }

[target.'cfg(target_os = "android")'.dependencies]
skyward-sys = { path = "../skyward-sys" }
zerocopy = { version = "0.8.63", features = ["derive"] }
