[package]
name = "skyward-net"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aes = "0.8.4"
anyhow = { workspace = true }
base64 = "0.22.1"
cbc = { version = "0.1.2", features = ["alloc", "block-padding"] }
dhcproto = "0.15.0"
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }
httparse = "1.10.1"
libc = { workspace = true }
skyward-files = { path = "../skyward-files" }
md-5 = "0.10.6"
serde = { workspace = true }
serde_json = "1.0.154"
# The resolver ureq takes is under its unversioned API, which may change
# between any two releases.
ureq = { version = "=3.5.0", default-features = false, features = ["rustls"] }
