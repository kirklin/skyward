[package]
name = "skyward-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
ab_glyph = "0.2.32"
# The stock status bar's outlines are filled as glyphs are.
ab_glyph_rasterizer = "0.1.10"
icu_locale_core = { version = "2.4.0", features = ["alloc"] }
# The recovery carries no time zone files, so the rules come built in.
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }
# Screenshots are saved as PNG.
png = "0.17.16"
# The settings are kept between starts as a JSON file.
serde = { workspace = true }
serde_json = "1.0.154"
skyward-info = { path = "../skyward-info" }
skyward-install = { path = "../skyward-install" }
skyward-net = { path = "../skyward-net" }
skyward-systems = { path = "../skyward-systems" }
skyward-vab = { path = "../skyward-vab" }
# The icons are outlines written as SVG path data, as the stock Settings
# writes its own: filled by the nonzero or the even-odd rule, and stroked
# with round ends.
svgtypes = "0.16.1"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
ttf-parser = "0.25.1"
unicode-width = "0.2.2"
vt100 = "0.18.1"

[dev-dependencies]
# The test that the typeface draws every text the pages write reads them
# from the source.
proc-macro2 = "1.0.107"
syn = { version = "2.0.119", features = ["full", "visit"] }

[target.'cfg(target_os = "android")'.dependencies]
drm = "0.15.0"
drm-ffi = "0.9.1"
libc = { workspace = true }
