[package]
name = "skyward"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "skyward"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { version = "4.5.51", features = ["derive"] }
skyward-config = { path = "../skyward-config" }
skyward-block = { path = "../skyward-block" }
skyward-vab = { path = "../skyward-vab" }
skyward-modules = { path = "../skyward-modules" }
skyward-info = { path = "../skyward-info" }
skyward-install = { path = "../skyward-install" }
skyward-sys = { path = "../skyward-sys" }
skyward-lp = { path = "../skyward-lp" }

[dev-dependencies]
tempfile = "3.27.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zstd = { version = "0.14.3", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
evdev = "0.13.2"
hex = { workspace = true }
skyward-backup = { path = "../skyward-backup" }
skyward-binder = { path = "../skyward-binder" }
skyward-crypto = { path = "../skyward-crypto" }
skyward-files = { path = "../skyward-files" }
zip = { version = "8.6.0", default-features = false }
libc = { workspace = true }
procfs = { version = "0.18.0", default-features = false }
skyward-ui = { path = "../skyward-ui" }
skyward-mtp = { path = "../skyward-mtp" }
skyward-omapi = { path = "../skyward-omapi" }
skyward-programs = { path = "../skyward-programs" }
skyward-systems = { path = "../skyward-systems" }
skyward-net = { path = "../skyward-net" }
ureq = { version = "=3.5.0", default-features = false }
