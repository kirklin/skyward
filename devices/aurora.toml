[device]
codename = "aurora"
brand = "Xiaomi"
model = "Xiaomi 14 Ultra"
ab = true
soc = { hans = "第三代骁龙®8移动平台", hant = "Snapdragon® 8 Gen 3 行動平台", en = "Snapdragon® 8 Gen 3 Mobile Platform" }
os_version_prop = "ro.mi.os.version.incremental"

[display]
# The panel's own mode, persist.sys.miui_default_resolution in the odm
# partition's build.prop and the n1 panel's mode in the device tree:
# 1440 by 3200. persist.sys.miui_resolution gives the lower mode the system
# starts in, 1080 by 2400 at 420, as the 13 Ultra's does; the density is
# that one's, at the panel's own width, as the 13 Ultra's is.
width = 1440
height = 3200
density = 560

[modules]
sources = ["vendor_boot", "vendor_dlkm", "vendor", "system_dlkm"]
# The touchscreen: Synaptics TouchComm over SPI behind Xiaomi's touch
# layer, the one touch driver the phone's own modules.load lists.
load = ["synaptics_tcm2"]

# As on the 17 Ultra, no init script of the phone's starts touch_report:
# the touch feature service turns the controller's raw frames into
# touches with /odm/lib64/libtouchreport.so, and a recovery runs none of
# it. Told through Xiaomi's touch layer, the driver has the controller
# report positions itself; that is known of the 17 Ultra's Synaptics
# controller and not yet tried on this phone's.
[touch]
writes = [{ path = "/sys/class/touch/touch_dev/enable_touch_raw", value = "0" }]

# What the phone's own init runs once the system has finished starting, as
# kernel-post-boot in /vendor/etc/init/hw/init.qti.kernel.rc. The kernel
# starts the CPU clusters on the performance governor, which holds them at
# their highest clock; the script hands them to WALT, lets idle CPUs power
# down and sets how the memory bus scales. Without it the CPUs stay at
# their highest clock and voltage even while idle, and the phone slowly
# heats up.
[[service]]
path = "/vendor/bin/sh"
args = ["/vendor/bin/init.kernel.post_boot.sh"]
libraries = ["/system/lib64", "/vendor/lib64"]
oneshot = true
user = "root"
groups = ["root", "system", "wakelock", "graphics"]

[[service]]
path = "/system/bin/sh"
args = ["-c", "mkdir -p /kmlibs && cp /mnt/system/system/lib64/libhardware.so /mnt/system/system/lib64/libvndksupport.so /mnt/system/system/lib64/libnetutils.so /mnt/system/system/lib64/bootstrap/libdl_android.so /kmlibs/ && printf '[recovery]\\nnamespace.default.isolated = false\\n' > /kmlibs/ld.config.txt && printf '<manifest version=\"1.0\" type=\"device\"><hal format=\"aidl\"><name>android.hardware.weaver</name><version>2</version><fqname>IWeaver/default</fqname></hal></manifest>' > /kmlibs/weaver.xml && printf '#!/system/bin/sh\\nexport LD_CONFIG_FILE=/kmlibs/ld.config.txt\\nexec \"$@\"\\n' > /kmlibs/km.sh && chmod 755 /kmlibs/km.sh && V=$(ls -d /system_dlkm/lib/modules/*/kernel/net/rfkill 2>/dev/null | head -1) && mount --bind $V/rfkill.ko /system_dlkm/flatten/lib/modules/rfkill.ko"]
oneshot = true
user = "root"
groups = ["root"]

# The credential service of the older kind refuses everything while it
# looks for the secure processing unit the recovery does not carry; the
# phone's own recovery turns that search off before starting it.
[[service]]
path = "/system/bin/sh"
args = ["-c", "setprop vendor.gatekeeper.disable_spu true; setprop vendor.gatekeeper.is_security_level_spu 0; true"]
oneshot = true
user = "root"
groups = ["root"]

# The secure world reaches back into Android through the listeners this
# daemon registers; the key service waits for them before it can use a key.
[[service]]
path = "/vendor/bin/qseecomd"
libraries = ["/vendor/lib64", "/vendor/lib64/hw", "/system/lib64", "/odm/lib64"]
sockets = ["notify-topology"]
ready_property = "vendor.sys.listeners.registered"
user = "root"
groups = ["root", "drmrpc"]

# The secure service gateway: the TEE calls back into the server it
# registers for system services.
[[service]]
path = "/vendor/bin/ssgtzd"
libraries = ["/kmlibs", "/vendor/lib64", "/vendor/lib64/hw", "/system/lib64", "/odm/lib64"]
sockets = ["ssgtzd", "ssgtzd_opener"]
user = "root"
groups = ["root", "system", "drmrpc"]
capabilities = ["WAKE_ALARM", "BLOCK_SUSPEND"]

# The key service, the only thing that can use keys the phone wrapped in
# hardware. All four names it registers have to be described, or the
# service directory refuses it. It waits, retrying, for qseecomd to come
# up, and then has the keymaster applet loaded on its own request: the
# session, and the calls back out of the secure world on it, are then the
# key service's own. Started before qseecomd and without a gate, or a
# qseecomd listener claims the applet first and its calls back find no
# objects, and the key service hangs on them forever.
[[service]]
path = "/kmlibs/km.sh"
args = ["/vendor/bin/hw/android.hardware.security.keymint-service-qti"]
libraries = ["/kmlibs", "/vendor/lib64", "/vendor/lib64/hw", "/system/lib64", "/odm/lib64"]
registers = [
    "android.hardware.security.keymint.IRemotelyProvisionedComponent/default",
    "android.hardware.security.secureclock.ISecureClock/default",
    "android.hardware.security.sharedsecret.ISharedSecret/default",
]
user = "root"
groups = ["root", "drmrpc"]

# The credential service: the secure world has it check a screen lock, and
# it is the only thing that can hand out the note the key service wants
# before using a key a screen lock guards.
[[service]]
path = "/kmlibs/km.sh"
args = ["/vendor/bin/hw/android.hardware.gatekeeper-service-qti"]
libraries = ["/kmlibs", "/vendor/lib64", "/vendor/lib64/hw", "/system/lib64", "/odm/lib64"]
ready_service = "android.hardware.gatekeeper.IGatekeeper/default"
# This phone describes its gatekeeper not among the manifest fragments but
# in its own SoC's manifest file, which the service directory asks for
# before it takes the registration.
description = "/vendor/etc/vintf/manifest_pineapple.xml"
user = "root"
groups = ["root", "drmrpc"]

# The boot control, which says which slot the bootloader starts next and
# switches it. It comes last: the phone is usable without it.
[[service]]
path = "/vendor/bin/hw/android.hardware.boot-service.qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_service = "android.hardware.boot.IBootControl/default"
user = "root"
groups = ["root"]

# WLAN: the kiwi node in the device tree, driven by qca_cld3_kiwi_v2, the
# one WLAN driver the phone's own modules.blocklist leaves of those its
# modules.load lists. Its cfg80211 asks for rfkill, one of the kernel's own
# modules in system_dlkm, as the 17 Ultra's does. Its recovery covers the
# vendor partition's firmware folder with the modem's, as the 13 Ultra's
# does, so the settings and the MAC address are given to the loader again:
# the settings from the vendor partition, the address from where the
# vendor's link points in persist. wpa_supplicant runs on the recovery's
# own libraries before the vendor partition's, as on the 17 Ultra.
# The secure world keeps its own files (the applets the key service and the
# credential service ask for) in the modem partition, which the listener
# mounts at /vendor/firmware_mnt and loads them from as they are first
# asked for; without the mount they are not there at all.
[firmware]
partition = "modem"

# persist holds the WLAN address and the key service's storage.
[partitions]
mounted = ["persist"]

[wlan]
modules = ["rfkill", "qca_cld3_kiwi_v2"]
writes = [{ path = "/sys/kernel/cnss/fs_ready", value = "1" }]
firmware = [
    { name = "wlan/qca_cld/kiwi_v2/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/kiwi_v2/WCNSS_qcom_cfg.ini" },
    { name = "wlan/qca_cld/kiwi_v2/wlan_mac.bin", path = "/mnt/vendor/persist/kiwi_v2/wlan_mac.bin" },
]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/system/lib64", "/vendor/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

# The update server the stock updater of the Chinese system asks.
[update]
server = "https://update.miui.com/updates/miotaV3.php"

# The stock build the recovery is made on: the Chinese system's
# OS3.0.308.0, whose full update package on the phone maker's own download
# server holds the recovery partition the recovery is built on top of.
[stock]
version = "OS3.0.308.0.WNACNXM"
package = "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS3.0.308.0.WNACNXM/aurora-ota_full-OS3.0.308.0.WNACNXM-user-16.0-9fad950443.zip"
recovery = "6baa25571871e7b177ed9c936857838aad21b5d9424e1244cd692ab6dae95c0a"

# qcom-hv-haptics (qcom,hv-haptics in its dtbo), whose driver says the
# motor's resonant frequency as the 17 Ultra's does; the click is made from
# samples at that frequency, and the strengths are the 17 Ultra's. Neither
# is yet tried on this phone's motor.
[haptics]
resonance = "/sys/class/qcom-haptics/lra_frequency_hz"
strength = { lightest = 0.25, strongest = 0.75 }
