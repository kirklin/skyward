[device]
codename = "haotian"
brand = "Xiaomi"
model = "Xiaomi 15 Pro"
ab = true
soc = { hans = "骁龙®8至尊版移动平台", hant = "Snapdragon® 8 Elite 行動平台", en = "Snapdragon® 8 Elite Mobile Platform" }
os_version_prop = "ro.mi.os.version.incremental"

[display]
# The panel's own mode, persist.sys.miui_default_resolution in the odm
# partition's build.prop and the o2 panel's mode in the device tree:
# 1440 by 3200. persist.sys.miui_resolution gives the lower mode the system
# starts in, 1080 by 2400 at 450; the density is that one's, at the panel's
# own width, as the 13 Ultra's is.
width = 1440
height = 3200
density = 600

[modules]
sources = ["vendor_boot", "vendor_dlkm", "vendor", "system_dlkm"]
# The touchscreen: Synaptics TouchComm over SPI behind Xiaomi's touch
# layer, the one touch driver the phone's own modules.load lists. The
# secure element: ST's ST54L, the part its NFC controller is in, whose
# stm_st54se_gpio makes the node the element's own service opens, and
# whose stm_nfc_i2c brings the other half of that part up, as the
# phone's own init loads both. The element is what the keys of a data
# partition bound to the weaver come from, so these are loaded before
# the services start: the element's service looks for its chip once.
load = ["synaptics_tcm2", "stm_st54se_gpio", "stm_nfc_i2c"]

# The secure element's node, which its driver makes root's alone: the
# element's service runs as system, as
# /vendor/etc/init/android.hardware.secure_element-service.qti.rc has it,
# and opens the node as that user.
[[owners]]
user = "system"
group = "system"
mode = 0o660
paths = ["/dev/st54spi_gpio"]

# The libraries the phone's own programs are linked against that the
# recovery's library folder does not hold. A phone of this system version
# has no bundle of libraries for its partitions to have been built
# against: ro.vndk.version is not set and there is no vndk apex. So the
# programs that use the phone's keys start with the recovery's own few and
# give up one after another: the key service wants libvndksupport and the
# libdl_android the runtime carries, the credential service the
# implementation its vendor partition keeps in its hw folder, and the
# secure element's service its own. Each is taken from where the phone
# keeps it and put beside the recovery's own, as the 17 Ultra's logd is
# given the two it loads.
[libraries]
paths = [
    "/mnt/system/system/lib64/libvndksupport.so",
    "/mnt/system/system/lib64/bootstrap/libdl_android.so",
    "/vendor/lib64/hw/libqtigatekeeper.so",
    "/vendor/lib64/hw/libEseUtils.so",
]

# As on the 17 Ultra, no init script of the phone's starts touch_report:
# the touch feature service turns the controller's raw frames into
# touches with /odm/lib64/libtouchreport.so, and a recovery runs none of
# it. Told through Xiaomi's touch layer, the driver has the controller
# report positions itself; that is known of the 17 Ultra's Synaptics
# controller and not yet tried on this phone's.
[touch]
writes = [{ path = "/sys/class/touch/touch_dev/enable_touch_raw", value = "0" }]

# What the phone's own init runs once the system has finished starting, as
# kernel-post-boot in /vendor/etc/init/hw/init.qti.kernel.rc. The kernel
# starts the CPU clusters on the performance governor, which holds them at
# their highest clock; the script hands them to WALT, lets idle CPUs power
# down and sets how the memory bus scales. Without it the CPUs stay at
# their highest clock and voltage even while idle, and the phone slowly
# heats up.
[[service]]
path = "/vendor/bin/sh"
args = ["/vendor/bin/init.kernel.post_boot.sh"]
libraries = ["/system/lib64", "/vendor/lib64"]
oneshot = true
user = "root"
groups = ["root", "system", "wakelock", "graphics"]

# WLAN: the peach node in the device tree, which either of the two Peach
# drivers the phone's own modules.load lists and its modules.blocklist
# leaves may drive, by the chip's revision. This phone's chips are the ones
# qca_cld3_peach_v2 drives: qca_cld3_peach loads and then gives up in
# pld_register_driver, "Fail to register pcie driver", so the kernel refuses
# it with EINVAL and only the one driver is named here. Their cfg80211 asks
# for rfkill, one of the kernel's own modules in system_dlkm, as the 17
# Ultra's does. Its recovery covers the vendor partition's firmware folder
# with the modem's, as the 13 Ultra's does, so the settings and the MAC
# address are given to the loader again, under the names each driver asks
# for: the settings from the vendor partition, the address from where the
# vendor's links point in persist.
# wpa_supplicant runs on the recovery's own libraries before the vendor
# partition's, as on the 17 Ultra.
[wlan]
modules = ["rfkill", "qca_cld3_peach_v2"]
writes = [{ path = "/sys/kernel/cnss/fs_ready", value = "1" }]
firmware = [
    { name = "wlan/qca_cld/peach/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/peach/WCNSS_qcom_cfg.ini" },
    { name = "wlan/qca_cld/peach/wlan_mac.bin", partition = "persist", path = "wlan/wlan_mac.bin" },
    { name = "wlan/qca_cld/peach_v2/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/peach_v2/WCNSS_qcom_cfg.ini" },
    { name = "wlan/qca_cld/peach_v2/wlan_mac.bin", partition = "persist", path = "wlan/wlan_mac.bin" },
]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/system/lib64", "/vendor/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

# The update server the stock updater of the Chinese system asks.
[update]
server = "https://update.miui.com/updates/miotaV3.php"

# The stock build the recovery is made on: the Chinese system's
# OS3.0.309.0, whose full update package on the phone maker's own download
# server holds the recovery partition the recovery is built on top of.
[stock]
version = "OS3.0.309.0.WOBCNXM"
package = "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS3.0.309.0.WOBCNXM/haotian-ota_full-OS3.0.309.0.WOBCNXM-user-16.0-f9387d12d7.zip"
recovery = "675c3755a00c993ad706550d79377e906abe2547f423f29ced2fb3587d170bd8"

# The motor is not one the recovery's own way of playing a click reaches. Its
# device tree gives three haptic devices and only one of them is on: the
# Cirrus CS40L26 at i2c 0x43, which is also the phone's speaker amplifier. The
# two the 17 Ultra uses are both marked off there (qcom,hv-haptics@f000 under
# the PMIH010X, and the WSA2's swr_haptics), so /sys/class/qcom-haptics never
# appears and none of the devices under /dev/input takes force-feedback
# effects. The CS40L26 does come up far enough to load its tuning from
# /odm/firmware and answer in its mailbox, but its probe ends at
# "PM Runtime Resume failed: -13": the driver turns runtime power management
# on from the sound card's side, which a recovery never brings up. That leaves
# the phone vibrating through Xiaomi's own vibrator service, which asks for
# /dev/qcom_haptic, and this phone is left without vibration rather than
# without pages: [haptics] is what makes the motor required.
