[device]
codename = "muyu"
tablet = true
supports_vibration = false
brand = "Xiaomi"
model = "Xiaomi Pad 7 Pro"
ab = true
soc = { hans = "第三代骁龙®8s移动平台", hant = "Snapdragon® 8s Gen 3 行動平台", en = "Snapdragon® 8s Gen 3 Mobile Platform" }
os_version_prop = "ro.mi.os.version.incremental"
battery_capacity_mah = 8850

[display]
# Native landscape panel mode: 3200x2136
width = 3200
height = 2136
density = 440
diagonal = 11.2
normal_brightness = 4095
minimum_brightness = 1

[firmware]
partition = "modem"
remoteproc = "adsp"

[modules]
sources = ["vendor_boot", "vendor_dlkm", "vendor", "system_dlkm"]
load = ["nt36532_touch"]

[touch]
writes = [{ path = "/sys/class/touch/touch_dev/enable_touch_raw", value = "0" }]
# Pad 7 Pro native landscape panel mapping
swap_xy = true
flip_y = true
ignored_devices = ["NVTCapacitivePenM80p", "NVTCapacitivePenP81c"]

# The stock host-processing binary for the Novatek touch controller.
[[service]]
path = "/odm/bin/touch_report_debug"
libraries = ["/odm/lib64", "/vendor/lib64", "/system/lib64"]
user = "root"
groups = ["root", "input", "system"]
capabilities = ["SYS_NICE"]

# The hardware keystore daemon (QTEE / smcinvoke listener)
[[service]]
path = "/vendor/bin/qseecomd"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_property = "vendor.sys.listeners.registered"
user = "root"
groups = ["root", "drmrpc"]


[[service]]
path = "/vendor/bin/sh"
args = ["/vendor/bin/init.kernel.post_boot.sh"]
libraries = ["/system/lib64", "/vendor/lib64"]
oneshot = true
user = "root"
groups = ["root", "system", "wakelock", "graphics"]

[wlan]
modules = ["rfkill", "qca_cld3_kiwi_v2"]
writes = [{ path = "/sys/kernel/cnss/fs_ready", value = "1" }]
firmware = [
    { name = "wlan/qca_cld/kiwi_v2/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/kiwi_v2/WCNSS_qcom_cfg.ini" },
    { name = "wlan/qca_cld/kiwi_v2/wlan_mac.bin", partition = "persist", path = "wlan/wlan_mac.bin", optional = true },
]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/vendor/lib64", "/system/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

[update]
server = "https://update.miui.com/updates/miotaV3.php"

[stock]
version = "OS4.0.3.0.XOYCNXM"
package = "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS4.0.3.0.XOYCNXM/muyu-ota_full-OS4.0.3.0.XOYCNXM-user-17.0-dc91ad6cc2.zip"
recovery = "029c1bc3207900e2722e90f46ecfa30e7ae503fe1eb8f25c1494926c76aa61dc"

[backup]
efs = ["persist"]
data_skipped = [
    "vendor/tzstorage",
    "vendor/qtee",
    "vendor/mitee",
    "vendor/goodix",
    "vendor/fingerprint",
    "vendor/fpdata",
    "vendor/misc/mi_fp",
]

[wipe]
logs = [
    "/data/miuilog",
    "/data/vendor/diag",
    "/data/vendor/bsplog",
    "/data/vendor/log",
    "/data/vendor/ramdump",
    "/data/vendor/ramdump_ssr",
    "/data/vendor/ssrdump",
    "/data/vendor/tombstones",
    "/data/vendor/wlan_logs",
]