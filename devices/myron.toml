# Initial profile from read-only stock inspection on 2026-11-12:
# OS4.0.6.0.XPMCNXM, framework 17/API37, vendor 16/API36.
# Recovery boot, touch, decryption and WLAN are not yet tested on myron.
# See myron.md, including the Java OMAPI dependency of stock Weaver.
[device]
codename = "myron"
brand = "Redmi"
model = "REDMI K90 Pro Max"
ab = true
soc = { hans = "第五代骁龙®8至尊版移动平台", hant = "Snapdragon® 8 Elite Gen 5 行動平台", en = "Snapdragon® 8 Elite Gen 5 Mobile Platform" }
os_version_prop = "ro.mi.os.version.incremental"

[display]
# Live DRM modes and persist.sys.miui_resolution agree on this size/DPI.
width = 1200
height = 2608
density = 480

# First bring-up must not repair the filesystem, upgrade KeyMint blobs or
# let stock metadata initialization delete existing keys automatically.
[decrypt]
read_only = true
auto_repair = false
key_upgrades = false

[modules]
sources = ["vendor_boot", "vendor_dlkm", "vendor", "system_dlkm"]
# The touchscreen: FocalTech's, over SPI behind Xiaomi's touch layer, the
# one touch driver the phone's own modules.load lists.
load = ["focaltech_touch_3683"]

# Stock has focaltech_ts, enable_touch_raw=1 and libtouchreport_alg_fts.so.
# There is no evidence yet that FocalTech supports the Synaptics raw=0
# workaround. Leave that write out until its position-reporting path is
# checked. Stock's touchfeature service below loads libtouchreport.so,
# libtouchreport_alg.so and libtouchreport_hal.so to process raw frames.

# These files exist on this phone and its touchfeature rc assigns them to
# system. Keep the observed device mode separate from the sysfs modes.
[[owners]]
user = "system"
group = "system"
mode = 0o666
paths = ["/dev/xiaomi-touch"]

[[owners]]
user = "system"
group = "system"
mode = 0o664
paths = [
    "/sys/class/touch/touch_dev/enable_touch_raw",
    "/sys/class/touch/touch_dev/resolution_factor",
    "/sys/class/touch/touch_dev/touch_thp_ic_cmd",
    "/sys/class/touch/touch_dev/touch_thp_ic_cmd_data",
    "/sys/class/touch/touch_dev/touch_finger_status",
    "/sys/class/touch/touch_dev/abnormal_event",
    "/sys/class/touch/touch_dev/palm_sensor",
    "/sys/class/touch/touch_dev/palm_sensor_1",
    "/sys/class/touch/touch_dev/touch_ic_buffer",
    "/sys/class/touch/touch_dev/fod_press_status",
    "/sys/class/touch/touch_dev/weak_doubletap_sensor",
]

# The firmware of the WLAN chip is on the modem partition, which the phone
# mounts at /vendor/firmware_mnt and its own recovery leaves unmounted.
[firmware]
partition = "modem"

# The persist partition, which the phone mounts at /mnt/vendor/persist and
# its own recovery leaves unmounted. The WLAN's MAC address is there.
[partitions]
mounted = ["persist"]

# Its stock recovery leaves out libsysutils and libcap, which the
# recovery's own logd loads, as the 17 Ultra's does.
[logd]
libraries = ["/mnt/system/system/lib64/libsysutils.so", "/mnt/system/system/lib64/libcap.so"]

# What the phone's own init runs once the system has finished starting, as
# kernel-post-boot in /vendor/etc/init/hw/init.qti.kernel.rc. The kernel
# starts both CPU clusters on the performance governor, which holds them at
# their highest clock, and Qualcomm's idle driver keeps idle CPUs from
# powering down until it is told otherwise; the script hands the clusters
# to WALT, lets idle CPUs power down and sets how the memory bus scales.
# Without it the CPUs stay at their highest clock and voltage even while
# idle, and the phone slowly heats up.
[[service]]
path = "/vendor/bin/sh"
args = ["/vendor/bin/init.kernel.post_boot.sh"]
libraries = ["/system/lib64", "/vendor/lib64"]
oneshot = true
user = "root"
groups = ["root", "system", "wakelock", "graphics"]

# The paths, accounts and capabilities below are from this phone's
# OS4.0.6.0 vendor/odm init files, not the 17 Ultra's service list.
# Start the observed AIDL boot control before the untested security chain
# so its readiness is not gated on a later KeyMint/Weaver failure.
[[service]]
path = "/vendor/bin/hw/android.hardware.boot-service.qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_service = "android.hardware.boot.IBootControl/default"
user = "root"
groups = ["root"]

[[service]]
path = "/odm/bin/hw/vendor.xiaomi.hw.touchfeature-service"
libraries = ["/system/lib64", "/vendor/lib64", "/odm/lib64", "/mnt/system/system/lib64", "/mnt/system/system/lib64/bootstrap"]
ready_service = "vendor.xiaomi.hw.touchfeature.ITouchFeature/default"
user = "system"
groups = ["system", "input"]
capabilities = ["SYS_NICE"]

[[service]]
path = "/vendor/bin/qseecomd"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_property = "vendor.sys.listeners.registered"
user = "root"
groups = ["root", "drmrpc"]

[[service]]
path = "/vendor/bin/hlosminkdaemon"
libraries = ["/system/lib64", "/vendor/lib64"]
user = "system"
groups = ["system", "oem_2912", "wakelock"]
capabilities = ["WAKE_ALARM", "BLOCK_SUSPEND"]

# The QTI native process, not the NXP NFC process, owns eSE1 on this phone.
# libEseUtils is in vendor/lib64/hw. libhardware needs libvndksupport and
# its bootstrap libdl_android dependency, absent from the stock ramdisk.
[[service]]
path = "/vendor/bin/hw/android.hardware.secure_element-service.qti"
libraries = ["/system/lib64", "/vendor/lib64", "/vendor/lib64/hw", "/mnt/system/system/lib64", "/mnt/system/system/lib64/bootstrap"]
ready_service = "android.hardware.secure_element.ISecureElement/eSE1"
registers = ["android.hardware.secure_element.ISecureElement/SIM1", "android.hardware.secure_element.ISecureElement/SIM2"]
user = "system"
groups = ["nfc", "system"]

# All four QTI interfaces were confirmed in VINTF and stock service list.
[[service]]
path = "/vendor/bin/hw/android.hardware.security.onekeymint-service-qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_service = "android.hardware.security.keymint.IKeyMintDevice/default"
registers = [
    "android.hardware.security.keymint.IRemotelyProvisionedComponent/default",
    "android.hardware.security.secureclock.ISecureClock/default",
    "android.hardware.security.sharedsecret.ISharedSecret/default",
]
user = "system"
groups = ["system", "drmrpc"]

[[service]]
path = "/vendor/bin/hw/android.hardware.gatekeeper-rust-service-qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_service = "android.hardware.gatekeeper.IGatekeeper/default"
user = "system"
groups = ["system"]

# NXP StrongBox uses HalToHalTransport to native eSE1. Its separate shared
# secret participates in the notes-key agreement alongside QTI's default.
# Stock's rc sets only the UID; /proc confirms primary GID 0.
[[service]]
path = "/odm/bin/hw/android.hardware.security.keymint3-service.strongbox.nxp"
libraries = ["/system/lib64", "/vendor/lib64", "/odm/lib64", "/mnt/system/system/lib64", "/mnt/system/system/lib64/bootstrap"]
# File capabilities trigger AT_SECURE, so missing dependencies must be in
# the REC's normal RAM search path, not just in LD_LIBRARY_PATH. These two
# installed 4.0.6 files' imports/versions match the exact REC/linker.
recovery_libraries = [
    { source = "/mnt/system/system/lib64/libvndksupport.so", sha256 = "24a35b4ca97ebb2fd8cab02baf8d4e3af49ceb7309c93268e5670eda3930d112" },
    { source = "/mnt/system/system/lib64/bootstrap/libdl_android.so", sha256 = "6ad8ee8bc0a67a2582f9a9bcc37a40af4aa21236b968a08a895099058066305a" },
]
ready_service = "android.hardware.security.keymint.IKeyMintDevice/strongbox"
registers = ["android.hardware.security.keymint.IRemotelyProvisionedComponent/strongbox", "android.hardware.security.sharedsecret.ISharedSecret/strongbox"]
user = "vendor_nxp_strongbox"
groups = ["root"]

# This is NXP Weaver2, not the conditional Goodix service on nezha.
# Its account is 2911 in the installed vendor passwd/group files.
# Its stock ese_weaver.so uses Java OMAPI. Preserve the executable/filecaps
# and bind the native replacement only in this child's private namespace.
# Confirm the actual mapped inode/hash before any read-only getConfig.
[[service]]
path = "/odm/bin/hw/android.hardware.weaver-service.nxp-qti"
libraries = ["/system/lib64", "/vendor/lib64", "/odm/lib64", "/mnt/system/system/lib64", "/mnt/system/system/lib64/bootstrap"]
library_overrides = [{ source = "/skyward/lib64/ese_weaver.so", target = "/odm/lib64/ese_weaver.so" }]
ready_service = "android.hardware.weaver.IWeaver/default"
user = "vendor_nxp_weaver"
groups = ["vendor_nxp_weaver"]

# Stock actually loads qca_cld3_peach_v2, has a qcom,cnss-peach sysfs
# device, and carries /vendor/etc/wifi/peach_v2. Recovery bring-up and any
# userspace calibration requirements have not yet been checked.
[wlan]
modules = ["rfkill", "qca_cld3_peach_v2"]
writes = [{ path = "/sys/kernel/cnss/fs_ready", value = "1" }]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/system/lib64", "/vendor/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

# The update server the stock updater of the Chinese system asks.
[update]
server = "https://update.miui.com/updates/miotaV3.php"

# Official OTA payload manifest and the active stock recovery_b independently
# agree on the complete 100 MiB image hash. CI also extracts and hashes it.
[stock]
version = "OS4.0.6.0.XPMCNXM"
package = "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS4.0.6.0.XPMCNXM/myron-ota_full-OS4.0.6.0.XPMCNXM-user-17.0-66564d402b.zip"
recovery = "49622932fb32ab623db336866734ad440a2e15af5f750ceb9b1d3d0f7fdabafc"

# qcom-hv-haptics (qcom,hv-haptics in its dtbo), with the click made from
# samples at the motor's resonant frequency as on the 17 Ultra. The
# strengths are the 17 Ultra's, which were felt on that phone's motor.
[haptics]
resonance = "/sys/class/qcom-haptics/lra_frequency_hz"
strength = { lightest = 0.25, strongest = 0.75 }
