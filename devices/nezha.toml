[device]
codename = "nezha"
brand = "Xiaomi"
model = "Xiaomi 17 Ultra"
ab = true
soc = { hans = "第五代骁龙®8至尊版移动平台", hant = "Snapdragon® 8 Elite Gen 5 行動平台", en = "Snapdragon® 8 Elite Gen 5 Mobile Platform" }
os_version_prop = "ro.mi.os.version.incremental"

[display]
width = 1200
height = 2608
density = 480
diagonal = 6.9
# The radius the stock settings round a page's corners to as it slides in.
corner_radius = 170

[modules]
sources = ["vendor_boot", "vendor_dlkm", "vendor", "system_dlkm"]
# The touchscreen: Synaptics TouchComm over SPI, behind Xiaomi's touch
# layer, whose input device the touches come in on. Its firmware is read
# from /odm/firmware.
load = ["synaptics_tcm2"]

# The driver resets the touch controller as it connects to it, and the
# controller comes back sending only raw frames, which the system's touch
# algorithm turns into touches: Xiaomi's touch feature service runs it from
# /odm/lib64/libtouchreport.so, and a recovery runs none of it. Told
# through Xiaomi's touch layer, the driver has the controller report
# positions itself, and has it do so again each time it wakes the
# controller.
[touch]
writes = [{ path = "/sys/class/touch/touch_dev/enable_touch_raw", value = "0" }]

# The firmware of the WLAN chip, and the apps the secure world loads for the
# secure element's service, are on the modem partition, which the phone
# mounts at /vendor/firmware_mnt and its own recovery leaves unmounted.
[firmware]
partition = "modem"

# The persist partition, which the phone mounts at /mnt/vendor/persist and
# its own recovery leaves unmounted. The secure world keeps its own files
# there, through a listener qseecomd registers: among them what the key
# service needs to use a key that cannot be rolled back, such as the one
# guarding each user's secret. The WLAN's MAC address is there as well.
[partitions]
mounted = ["persist"]

# The recovery's own logd loads libsysutils and libcap, which the stock
# recovery leaves out, so it ends as soon as init starts it, init starts it
# again every five seconds, and nothing the phone's own programs log is
# kept. The installed system carries both, built from the same sources.
[logd]
libraries = ["/mnt/system/system/lib64/libsysutils.so", "/mnt/system/system/lib64/libcap.so"]

# What the phone's own init runs once the system has finished starting, as
# the user and in the groups its init script on the phone gives it. The
# kernel starts both CPU clusters on the performance governor, which holds
# them at their highest clock, and Qualcomm's idle driver keeps idle CPUs
# from powering down until it is told otherwise; the script hands the
# clusters to WALT, lets idle CPUs power down and sets how the memory bus
# scales. Without it the CPUs stay at their highest clock and voltage even
# while idle, and the phone slowly heats up. It needs none of the programs
# that use the phone's keys, which the recovery reads from the phone's own
# partitions, and runs before them, so one of them that does not come up
# still leaves the CPUs settled.
[[service]]
path = "/vendor/bin/sh"
args = ["/vendor/bin/init.kernel.post_boot.sh"]
libraries = ["/system/lib64", "/vendor/lib64"]
oneshot = true
user = "root"
groups = ["root", "system", "wakelock", "graphics"]

# WLAN: Qualcomm's Peach on PCIe, driven by qca_cld3_peach_v2 over the
# cnss2 platform driver. The vendor's cfg80211 asks for rfkill, one of the
# kernel's own modules in system_dlkm, which the system loads before any of
# the vendor's and a recovery leaves out. Once fs_ready is written, cnss2
# powers the chip up and loads its firmware from the modem partition, and
# wlan0 appears. The driver reads its settings and the MAC address through
# the firmware loader, from links the vendor partition keeps in its own
# firmware folder, into the vendor partition and into persist.
# wpa_supplicant runs on the recovery's own libraries before the vendor
# partition's: the vendor partition carries its own copies of the lowest of
# them, and a program loading those would not be understood by the
# recovery's service directory. Whether a network joined reaches the
# internet is asked of the page the stock system's NetworkStack overlay
# names, on the product partition.
[wlan]
modules = ["rfkill", "qca_cld3_peach_v2"]
writes = [{ path = "/sys/kernel/cnss/fs_ready", value = "1" }]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/system/lib64", "/vendor/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

# The update server the stock updater of the Chinese system asks.
[update]
server = "https://update.miui.com/updates/miotaV3.php"

# The stock build the recovery is made on: the Chinese system's OS4.0.4.0,
# whose full update package on the phone maker's own download server holds
# the recovery partition the recovery is built on top of.
[stock]
version = "OS4.0.4.0.XPACNXM"
package = "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS4.0.4.0.XPACNXM/nezha-ota_full-OS4.0.4.0.XPACNXM-user-17.0-4cf5faf3ac.zip"
recovery = "faa425b10231a0cfe2d74ff34f344f032ee2d891ea5e9420bf4e67cd86d622a7"

# qcom-hv-haptics. The waveforms the driver keeps play nothing in a
# recovery, though the driver loads and plays them without complaint, and
# it would drive them at the period its device tree gives, 5555 µs, while
# the motor swings at its own frequency, 172.4 Hz on one phone, which the
# phone measures as it boots and the driver keeps. The click is made from
# samples at that frequency instead, which the driver plays at up to the
# 8500 mV its device tree gives samples. The system's own clicks feel as
# one at a quarter of that does, lighter ones can hardly be felt, and past
# three quarters the motor rattles.
[haptics]
resonance = "/sys/class/qcom-haptics/lra_frequency_hz"
strength = { lightest = 0.25, strongest = 0.75 }

# The partitions a backup of the baseband and EFS takes: the baseband's
# settings, with the IMEI, and the sensors' calibration. And what of the
# data partition a backup leaves out because the secure world keeps it in
# step with itself: its own storage, its apps' data, that of Xiaomi's own
# trusted environment, the secure element's state and the fingerprint
# templates.
[backup]
efs = ["modemst1", "modemst2", "fsg", "fsc", "persist"]
data_skipped = [
    "vendor/tzstorage",
    "vendor/qtee",
    "vendor/mitee",
    "vendor/goodix",
    "vendor/fingerprint",
    "vendor/fpdata",
    "vendor/misc/mi_fp",
]

# Where the phone's own programs keep logs in the data partition: the
# system's, the minidumps, what Xiaomi's log manager keeps of each part of
# the phone, and what the modem, Wi-Fi and Bluetooth leave when they crash.
[wipe]
logs = [
    "/data/miuilog",
    "/data/vendor/diag",
    "/data/vendor/bsplog",
    "/data/vendor/log",
    "/data/vendor/ramdump",
    "/data/vendor/ramdump_ssr",
    "/data/vendor/ssrdump",
    "/data/vendor/tombstones",
    "/data/vendor/wlan_logs",
]
