[device]
codename = "polaris"
brand = "Xiaomi"
model = "Xiaomi Mi MIX 2S"
# A-only: one boot and one recovery partition, and no dynamic partitions.
ab = false
soc = { hans = "骁龙®845移动平台", hant = "Snapdragon® 845 行動平台", en = "Snapdragon® 845 Mobile Platform" }
os_version_prop = "ro.build.version.incremental"

[display]
# 5.99 inches, 18:9, as the panel reports itself.
width = 1080
height = 2160
density = 420
diagonal = 5.99

# Android 9 and 10 keep their kernel modules in the vendor partition, in
# /vendor/lib/modules, the only place the stock recovery loads them from.
[modules]
sources = ["vendor"]

# The phone's own table mounts persist at /mnt/vendor/persist, which its
# recovery leaves unmounted; the sensors' calibration and the WLAN's MAC
# address are there.
[partitions]
mounted = ["persist"]

# The baseband's settings and the sensors' calibration, as every Xiaomi
# phone of this generation keeps them.
[backup]
efs = ["modemst1", "modemst2", "fsg", "fsc", "persist"]

[update]
server = "https://update.miui.com/updates/miotaV3.php"
