[device]
codename = "polaris"
brand = "Xiaomi"
model = "Xiaomi MIX 2S"
# A-only: no _a/_b slot suffixes, no super, no vendor_boot.
ab = false
soc = { hans = "高通骁龙™845移动平台", hant = "高通驍龍™845行動平台", en = "Qualcomm Snapdragon 845 Mobile Platform" }
os_version_prop = "ro.build.version.incremental"

[display]
# 5.99-inch 1080x2160 IPS, 403 ppi.
width = 1080
height = 2160
density = 403
diagonal = 5.99

[modules]
# Android 10 keeps every module on the vendor partition; there is no
# vendor_boot or vendor_dlkm.
sources = ["vendor"]
