[device]
codename = "socrates"
brand = "Redmi"
model = "REDMI K60 Pro"
ab = true
soc = { hans = "第二代骁龙®8移动平台", hant = "Snapdragon® 8 Gen 2 行動平台", en = "Snapdragon® 8 Gen 2 Mobile Platform" }
os_version_prop = "ro.mi.os.version.incremental"

[display]
# The M11 panel's native mode, also used by the Goodix input device.
width = 1440
height = 3200
# The same logical DPI as the other 1440-wide SM8550 profiles.
density = 560
# touch_report restarted under a lit panel needs a fresh panel resume.
reset_on_start = true

# Bring up existing encrypted data without repairs, journal replay or
# KeyMint blob upgrades. PIN verification is performed on the phone.
[decrypt]
read_only = true

[modules]
sources = ["vendor_boot", "vendor_dlkm", "vendor"]
# The phone's modules.load names Goodix, not the FTS driver of fuxi/nuwa.
# touch_report processes the GT9916S controller's raw frames.
# CNSS's device and QMI service must exist before cnss-daemon connects.
# fs_ready is still deferred until the WLAN is turned on below.
load = ["xiaomi_touch", "goodix_core", "qca_cld3_kiwi_v2"]

# The module creates this after the initial vendor ueventd rules are
# applied. Its owner and mode are from /vendor/etc/ueventd.rc.
[[owners]]
user = "wifi"
group = "wifi"
mode = 0o660
paths = ["/dev/wlan"]

# The stock touchfeature init rules hand these files to the system user.
# The touch_dev entries below were also seen on the running phone; the
# other controllers' extra nodes in that shared init script are omitted.
[[owners]]
user = "system"
group = "system"
mode = 0o664
paths = [
    "/dev/xiaomi-touch",
    "/proc/tp_hal_version",
    "/proc/tp_fw_version",
    "/proc/tp_lockdown_info",
    "/sys/class/touch/touch_dev/gesture_single_tap_state",
    "/sys/class/touch/touch_dev/fod_press_status",
    "/sys/class/touch/touch_dev/update_rawdata",
    "/sys/class/touch/touch_dev/enable_touch_raw",
    "/sys/class/touch/touch_dev/enable_touch_delta",
    "/sys/class/touch/touch_dev/touch_thp_dump",
    "/sys/class/touch/touch_dev/touch_thp_cmd",
    "/sys/class/touch/touch_dev/suspend_state",
    "/sys/class/touch/touch_dev/prox_sensor",
    "/sys/class/touch/touch_dev/touch_thp_rx_num",
    "/sys/class/touch/touch_dev/touch_thp_tx_num",
    "/sys/class/touch/touch_dev/touch_thp_x_resolution",
    "/sys/class/touch/touch_dev/touch_thp_y_resolution",
    "/sys/class/touch/touch_dev/touch_thp_smooth",
    "/sys/class/touch/touch_dev/touch_thp_noisefilter",
    "/sys/class/touch/touch_dev/touch_thp_downthd",
    "/sys/class/touch/touch_dev/touch_thp_upthd",
    "/sys/class/touch/touch_dev/touch_thp_movethd",
    "/sys/class/touch/touch_dev/touch_thp_islandthd",
    "/sys/class/touch/touch_dev/touch_thp_cmd_data",
    "/sys/class/touch/touch_dev/palm_sensor_data",
    "/sys/class/touch/touch_dev/palm_sensor",
    "/sys/class/touch/touch_dev/touch_active_status",
    "/sys/class/touch/touch_dev/touch_finger_status",
    "/sys/class/touch/touch_dev/touch_irq_no",
    "/sys/class/touch/touch_dev/touch_sensor",
    "/sys/class/touch/touch_dev/touch_sensor_ctrl",
    "/sys/class/touch/touch_dev/touch_thp_mem_notify",
    "/sys/class/touch/touch_dev/touch_thp_testmode",
    "/sys/class/touch/touch_dev/touch_thp_testresult",
    "/sys/class/touch/touch_dev/touch_thp_preset_point",
    "/sys/class/touch/touch_dev/touch_thp_breakline_mode",
    "/sys/class/touch/touch_dev/touch_thp_breakline_result",
    "/sys/class/touch/touch_dev/touch_doze_analysis",
    "/sys/class/touch/touch_dev/touch_thp_cmd_ready",
    "/sys/class/touch/touch_dev/touch_ic_buffer",
    "/sys/class/touch/touch_dev/abnormal_event",
]

# The stock kernel-post-boot service releases the performance governor
# before the touch programs start, as on the other SM8550 phones.
[[service]]
path = "/vendor/bin/sh"
args = ["/vendor/bin/init.kernel.post_boot.sh"]
libraries = ["/system/lib64", "/vendor/lib64"]
oneshot = true
user = "root"
groups = ["root", "system", "wakelock", "graphics"]

[[service]]
path = "/odm/bin/touch_report"
user = "system"
groups = ["system", "uhid", "input"]
capabilities = ["SYS_NICE"]

# The phone's vendor rc runs these as root:drmrpc and system:drmrpc.
# Its vendor ABI is 33; secure::libraries also opens its installed v33
# VNDK APEX, rather than using the Android 17 port as the vendor ABI.
[[service]]
path = "/vendor/bin/qseecomd"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_property = "vendor.sys.listeners.registered"
user = "root"
groups = ["root", "drmrpc"]

# Gatekeeper is HIDL 1.0 on this phone. Its service directory comes from
# the installed system, with that system's loader and libraries.
[[service]]
path = "/mnt/system_ext/bin/hwservicemanager"
libraries = ["/mnt/system/system/lib64/bootstrap", "/mnt/system/system/lib64", "/mnt/system_ext/lib64"]
ready_property = "hwservicemanager.ready"
user = "system"
groups = ["system", "readproc"]

# The actual vendor manifest declares KeyMint V2, shared secret, secure
# clock and remote provisioning in this process. Naming the shared-secret
# interface also has Skyward perform the token-key agreement before PINs
# are checked; no credential or key blob is changed by that agreement.
[[service]]
path = "/vendor/bin/hw/android.hardware.security.keymint-service-qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_service = "android.hardware.security.sharedsecret.ISharedSecret/default"
registers = [
    "android.hardware.security.keymint.IKeyMintDevice/default",
    "android.hardware.security.secureclock.ISecureClock/default",
    "android.hardware.security.keymint.IRemotelyProvisionedComponent/default",
]
user = "system"
groups = ["system", "drmrpc"]

[[service]]
path = "/vendor/bin/hw/android.hardware.gatekeeper@1.0-service-qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_hardware_service = "android.hardware.gatekeeper@1.0::IGatekeeper/default"
user = "system"
groups = ["system"]

# The working stock-kernel DSU path needs both the QRTR name service and
# the CNSS userspace calibration service before fs_ready. Loading only
# qca_cld3_kiwi_v2 does not supply either. Keep them in the foreground so
# the recovery supervises the actual processes.
[[service]]
path = "/vendor/bin/qrtr-ns"
args = ["-f"]
libraries = ["/system/lib64", "/vendor/lib64"]
user = "root"
groups = ["root"]

[[service]]
path = "/vendor/bin/cnss-daemon"
args = ["-n"]
libraries = ["/system/lib64", "/vendor/lib64"]
user = "system"
groups = ["system", "inet", "net_admin", "wifi"]
capabilities = ["NET_ADMIN"]
# Keep its fixed cache paths in RAM when the recovery opens real userdata.
memory_data = true

# The installed vendor exposes boot control through HIDL 1.2. Describing
# it here also puts the interface in the recovery's hardware manifest.
[[service]]
path = "/vendor/bin/hw/android.hardware.boot@1.2-service"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_hardware_service = "android.hardware.boot@1.2::IBootControl/default"
user = "root"
groups = ["root"]

# WCN7850 uses the stock driver. Its ini is required, while the separate
# persist MAC file is absent on the tested phone. Let the driver continue
# without it instead of making this optional file a startup requirement.
[wlan]
modules = ["qca_cld3_kiwi_v2"]
writes = [{ path = "/sys/kernel/cnss/fs_ready", value = "1" }]
firmware = [
    { name = "wlan/qca_cld/kiwi_v2/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/kiwi_v2/WCNSS_qcom_cfg.ini" },
    { name = "wlan/qca_cld/kiwi_v2/wlan_mac.bin", partition = "persist", path = "kiwi_v2/wlan_mac.bin", optional = true },
]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/vendor/lib64", "/system/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

[update]
server = "https://update.miui.com/updates/miotaV3.php"

# The official stock build matching the phone's vendor/odm version.
# The recovery hash and 100 MiB partition size come from its OTA payload
# manifest; the packer independently verifies the extracted image.
[stock]
version = "OS3.0.304.0.WMKCNXM"
package = "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS3.0.304.0.WMKCNXM/socrates-ota_full-OS3.0.304.0.WMKCNXM-user-16.0-694e581e9e.zip"
recovery = "a1ed92db62fb0915b20309c5fe80b9181c6cf3ecef7d76e68503a2e1e9ff8c88"

# The stock qcom-hv-haptics driver exposes the same resonance interface as
# ishtar. Until the stock waveforms are checked, let Skyward make a click
# at the measured resonance instead of assuming an effect number.
[haptics]
resonance = "/sys/class/qcom-haptics/lra_frequency_hz"
strength = { lightest = 0.5, strongest = 1.0 }
