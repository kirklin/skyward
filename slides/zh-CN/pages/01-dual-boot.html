<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../../readme.css">
</head>
<body>
<main class="slide feature">
  <header class="head">
    <p class="eyebrow">双系统</p>
    <h1 class="headline">一台手机可以<br>安装两个系统。</h1>
    <p class="body">第二系统保存在 data 分区中，主系统可以是<br><span translate="no">HyperOS</span> 或第三方 <span translate="no">ROM</span>。在「双系统」中<br>点按卡片并滑动确认，就会重启到这个系统。</p>
  </header>
  <div class="visual">
    <p class="ui-section">下次启动</p>
    <div class="ui-card">
      <div>
        <p class="role">主系统</p>
        <p class="name" translate="no">HyperOS 3</p>
        <p class="detail" translate="no">OS3.0.308.0.WMACNXM</p>
      </div>
      <span class="mark"></span>
    </div>
    <div class="ui-card">
      <div>
        <p class="role">第二系统</p>
        <p class="name" translate="no">Ubuntu Touch</p>
        <p class="detail" translate="no">24.04-1.x</p>
      </div>
      <span class="mark on"><svg viewBox="0 0 24 24"><path class="icon-line" d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
    </div>
    <div class="ui-slider">
      <span class="knob"><svg viewBox="0 0 24 24"><path class="icon-line" d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      <span class="label">滑动以切换并重启</span>
    </div>
  </div>
</main>
</body>
</html>
