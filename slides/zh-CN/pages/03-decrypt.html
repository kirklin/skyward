<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../../readme.css">
</head>
<body>
<main class="slide feature">
  <header class="head">
    <p class="eyebrow">解密</p>
    <h1 class="headline">用锁屏图案或密码<br>解密 data 分区。</h1>
    <p class="body"><span translate="no">Skyward</span> 通过手机自带的安全服务取得密钥。<br>手机有多个用户时，可以分别解密每个用户的文件。</p>
  </header>
  <div class="visual">
    <div class="lock">
      <p class="title">绘制锁屏图案</p>
      <p class="note">解密后可查看本机文件</p>
      <svg viewBox="0 0 600 600">
        <circle class="halo" cx="100" cy="100" r="46"/>
        <circle class="halo" cx="100" cy="300" r="46"/>
        <circle class="halo" cx="300" cy="300" r="46"/>
        <circle class="halo" cx="500" cy="300" r="46"/>
        <circle class="halo" cx="500" cy="500" r="46"/>
        <polyline points="100,100 100,300 300,300 500,300 500,500"/>
        <circle class="dot on" cx="100" cy="100" r="18"/>
        <circle class="dot" cx="300" cy="100" r="12"/>
        <circle class="dot" cx="500" cy="100" r="12"/>
        <circle class="dot on" cx="100" cy="300" r="18"/>
        <circle class="dot on" cx="300" cy="300" r="18"/>
        <circle class="dot on" cx="500" cy="300" r="18"/>
        <circle class="dot" cx="100" cy="500" r="12"/>
        <circle class="dot" cx="300" cy="500" r="12"/>
        <circle class="dot on" cx="500" cy="500" r="18"/>
      </svg>
    </div>
  </div>
</main>
</body>
</html>
