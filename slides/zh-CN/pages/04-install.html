<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../../readme.css">
</head>
<body>
<main class="slide feature">
  <header class="head">
    <p class="eyebrow">安装</p>
    <h1 class="headline">从三个来源安装<br>四种安装包。</h1>
    <p class="body">安装脚本可以使用 7za、zstd、avbctl 和 resetprop。<br>安装覆盖了 recovery 分区时，<br><span translate="no">Skyward</span> 可以重新刷回自己。</p>
  </header>
  <div class="visual">
    <p class="ui-section">安装方式</p>
    <ul class="ui-list">
      <li>
        <span class="app blue"><svg viewBox="0 0 24 24"><g class="icon-line"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></g></svg></span>
        <div><b>从内部存储安装</b><small>选择内部存储中的更新包或镜像</small></div>
        <svg class="chevron" viewBox="0 0 24 24"><path class="icon-line" d="M9 6l6 6-6 6"/></svg>
      </li>
      <li>
        <span class="app cyan"><svg viewBox="0 0 24 24"><g class="icon-line"><rect x="8.5" y="2.5" width="7" height="6" rx="1"/><rect x="6.5" y="8.5" width="11" height="13" rx="2.5"/><path d="M11 5v1M13 5v1"/></g></svg></span>
        <div><b>从 U 盘安装</b><small>请通过 OTG 连接 U 盘</small></div>
        <svg class="chevron" viewBox="0 0 24 24"><path class="icon-line" d="M9 6l6 6-6 6"/></svg>
      </li>
      <li>
        <span class="app green"><svg viewBox="0 0 24 24"><g class="icon-line"><path d="M9 2.5v4.5M15 2.5v4.5"/><path d="M6.5 7h11v4a5.5 5.5 0 0 1-11 0V7z"/><path d="M12 16.5v5"/></g></svg></span>
        <div><b>通过电脑安装</b><small>在电脑上运行 adb sideload</small></div>
        <svg class="chevron" viewBox="0 0 24 24"><path class="icon-line" d="M9 6l6 6-6 6"/></svg>
      </li>
    </ul>
    <ul class="chip-rows">
      <li>
        <p>可以安装</p>
        <ul>
          <li>A/B 完整更新包</li>
          <li>刷机包</li>
          <li>分区镜像</li>
          <li>第二系统</li>
        </ul>
      </li>
    </ul>
  </div>
</main>
</body>
</html>
