<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../../readme.css">
</head>
<body>
<main class="slide feature">
  <header class="head">
    <p class="eyebrow">搜索</p>
    <h1 class="headline">输入拼音首字母，<br>就能找到功能。</h1>
    <p class="body">首页的搜索栏可以查找功能和分区，<br>支持拼音全拼、首字母和英文，<br>例如输入 bf 就能找到「备份」。</p>
  </header>
  <div class="visual">
    <div class="search-bar">
      <svg viewBox="0 0 24 24"><g class="icon-line"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5l5 5"/></g></svg>
      <span translate="no">wj</span><i class="caret"></i>
    </div>
    <ul class="ui-list">
      <li><div><b>文件管理</b><small>高级</small></div></li>
      <li><div><b>文件系统</b><small>高级</small></div></li>
      <li><div><b>文件传输</b><small>设置</small></div></li>
    </ul>
    <p class="ui-section">其他例子</p>
    <ul class="finds">
      <li><code translate="no">bf</code><svg viewBox="0 0 24 24"><path class="icon-line" d="M5 12h14M13 6l6 6-6 6"/></svg><span>备份</span></li>
      <li><code translate="no">guazai</code><svg viewBox="0 0 24 24"><path class="icon-line" d="M5 12h14M13 6l6 6-6 6"/></svg><span>挂载</span></li>
      <li><code translate="no">sxt</code><svg viewBox="0 0 24 24"><path class="icon-line" d="M5 12h14M13 6l6 6-6 6"/></svg><span>双系统</span></li>
      <li><code translate="no">wipe</code><svg viewBox="0 0 24 24"><path class="icon-line" d="M5 12h14M13 6l6 6-6 6"/></svg><span>清除数据</span></li>
    </ul>
  </div>
</main>
</body>
</html>
