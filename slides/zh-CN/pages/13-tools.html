<body>
<main class="slide feature">
  <header class="head">
    <p class="eyebrow">高级</p>
    <h1 class="headline">系统出了问题，<br>可以先在这里修复。</h1>
    <p class="body">可以修复文件系统和 SELinux 上下文，<br>只读挂载 super 中的分区，导出日志，<br>还可以完成尚未合并的系统更新。</p>
  </header>
  <div class="visual">
    <ul class="ui-list">
      <li>
        <span class="glyph"><svg viewBox="0 0 24 24"><g class="icon-line"><ellipse cx="12" cy="6" rx="7.5" ry="2.8"/><path d="M4.5 6v12c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8V6M4.5 12c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8"/></g></svg></span>
        <div><b>修复文件系统</b><small>检查整个文件系统，并修复发现的错误</small></div>
        <svg class="chevron" viewBox="0 0 24 24"><path class="icon-line" d="M9 6l6 6-6 6"/></svg>
      </li>
      <li>
        <span class="glyph"><svg viewBox="0 0 24 24"><path class="icon-line" d="M12 3l7.5 3v5.5c0 4.5-3.2 8-7.5 9.5-4.3-1.5-7.5-5-7.5-9.5V6zM8.8 12l2.2 2.2 4.2-4.4"/></svg></span>
        <div><b>修复 SELinux 上下文</b><small>按已安装系统的规则，<br>重新设置 data 分区中文件的 SELinux 上下文</small></div>
        <svg class="chevron" viewBox="0 0 24 24"><path class="icon-line" d="M9 6l6 6-6 6"/></svg>
      </li>
      <li>
        <span class="glyph"><svg viewBox="0 0 24 24"><g class="icon-line"><rect x="3.5" y="5" width="17" height="6" rx="1.5"/><rect x="3.5" y="13" width="17" height="6" rx="1.5"/><path d="M7 8h.01M7 16h.01"/></g></svg></span>
        <div><b>挂载</b><small>只读挂载当前槽位在 super 中的分区</small></div>
        <svg class="chevron" viewBox="0 0 24 24"><path class="icon-line" d="M9 6l6 6-6 6"/></svg>
      </li>
      <li>
        <span class="glyph"><svg viewBox="0 0 24 24"><path class="icon-line" d="M6.5 3h8l4 4v13a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM14.5 3v4h4M8.5 12h7M8.5 15.5h7"/></svg></span>
        <div><b>导出日志</b><small>保存 Recovery 日志和内核日志</small></div>
        <svg class="chevron" viewBox="0 0 24 24"><path class="icon-line" d="M9 6l6 6-6 6"/></svg>
      </li>
      <li>
        <span class="glyph"><svg viewBox="0 0 24 24"><path class="icon-line" d="M12 3.5l8.5 4.5-8.5 4.5-8.5-4.5zM3.5 12l8.5 4.5 8.5-4.5M3.5 16l8.5 4.5 8.5-4.5"/></svg></span>
        <div><b>系统更新</b><small>合并已经安装的系统更新</small></div>
        <svg class="chevron" viewBox="0 0 24 24"><path class="icon-line" d="M9 6l6 6-6 6"/></svg>
      </li>
    </ul>
