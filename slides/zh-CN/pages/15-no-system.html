<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../../readme.css">
</head>
<body>
<main class="slide feature">
  <header class="head">
    <p class="eyebrow">没有系统时</p>
    <h1 class="headline">super 中没有系统，<br>也能装回一个系统。</h1>
    <p class="body">屏幕、按键、adb、adb sideload 和 fastbootd<br>照常使用。触摸、WLAN 和解密需要系统中的程序，<br>装回系统后随之恢复。</p>
  </header>
  <div class="visual">
    <div class="bare">
      <div class="strip">
        <div class="on"><b translate="no">recovery</b><small translate="no">Skyward</small></div>
        <div class="gone"><b translate="no">super</b><small>没有系统</small></div>
      </div>
      <div class="split">
        <section class="hot">
          <p>照常使用</p>
          <ul>
            <li><svg viewBox="0 0 24 24"><g class="icon-line"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></g></svg>屏幕和按键</li>
            <li><svg viewBox="0 0 24 24"><g class="icon-line"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M7 9.5l3 2.5-3 2.5M12.5 15h4.5"/></g></svg><span translate="no">adb</span></li>
            <li><svg viewBox="0 0 24 24"><path class="icon-line" d="M12 3.5v11M7.5 10l4.5 4.5 4.5-4.5M5 19.5h14"/></svg><span translate="no">adb sideload</span></li>
            <li><svg viewBox="0 0 24 24"><path class="icon-line" d="M13 2.5L5.5 13.5h6l-1 8 8-11h-6z"/></svg><span translate="no">fastbootd</span></li>
          </ul>
        </section>
        <section>
          <p>装回系统后恢复</p>
          <ul>
            <li><svg viewBox="0 0 24 24"><path class="icon-line" d="M9 11.5V5a1.5 1.5 0 0 1 3 0v6m0-2a1.5 1.5 0 0 1 3 0v2.5m0-1.5a1.5 1.5 0 0 1 3 0v4.5a6.5 6.5 0 0 1-6.5 6.5h-.5a6.5 6.5 0 0 1-5.4-2.9L4.3 14a1.5 1.5 0 0 1 2.4-1.8L9 15"/></svg>触摸</li>
            <li><svg viewBox="0 0 24 24"><path class="icon-line" d="M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.5 16a5 5 0 0 1 7 0M12 19.5h.01"/></svg><span translate="no">WLAN</span></li>
            <li><svg viewBox="0 0 24 24"><g class="icon-line"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></g></svg>解密</li>
          </ul>
        </section>
      </div>
    </div>
  </div>
</main>
</body>
</html>
